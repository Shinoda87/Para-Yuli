<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Yuli 🌻 - Mindfreak87</title>
<style>
  body{margin:0;background:#000;height:100vh;display:flex;justify-content:center;align-items:center;font-family:sans-serif;overflow:hidden}
  #p1, #p2{position:absolute;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  #p1{background:#fff9c4;color:#5d4037}
  #p2{background:#000;color:#ffeb3b;display:none}
  h1{font-size:34px} .btn{background:#ffeb3b;border:none;padding:16px 40px;border-radius:30px;font-weight:bold;font-size:19px;cursor:pointer;box-shadow:0 0 25px #ffeb3b;margin-top:20px}
  .flower{font-size:130px;animation:b 1.5s infinite alternate} @keyframes b{from{transform:scale(.8)}to{transform:scale(1.2)}}
  p{color:white;font-size:18px;max-width:330px;line-height:1.6} .foot{font-size:11px;color:#666;margin-top:15px}
</style>
</head>
<body>
<div id="p1">
  <h1>Para Yuli 🌻</h1>
  <p style="color:#5d4037">Tengo un detalle para mi amor 💛</p>
  <div style="font-size:70px">💌</div>
  <button class="btn" onclick="abrir()">Toca aquí gordita ✨</button>
  <div class="foot">— Mindfreak87 —</div>
</div>
<div id="p2">
  <h1>Para Yuli 🌻</h1>
  <div class="flower">🌻</div>
  <p>Un pequeño detalle amarillo para mi amor porque hay personas que merecen un poquito de luz incluso un día cualquiera, te amo gordita. 💛</p>
  <div class="foot">Hecho especialmente para Yuli — Mindfreak87</div>
  <iframe id="yt" style="display:none" width="0" height="0" src="" allow="autoplay"></iframe>
</div>
<audio id="musica" loop><source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8c8a73467.mp3?filename=flores-amarillas-floricienta-piano-112199.mp3" type="audio/mpeg"></audio>
<script>
function abrir(){
  document.getElementById('p1').style.display='none';
  document.getElementById('p2').style.display='flex';
  document.getElementById('musica').play();
  document.getElementById('yt').src="https://www.youtube.com/embed/c4r3mGs8a1w?autoplay=1&loop=1&playlist=c4r3mGs8a1w";
}
</script>
</body>
</html>
