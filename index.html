<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Yuli 🌻 - Shinoda87</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;display:flex;justify-content:center;align-items:center;min-height:100vh;overflow:hidden;font-family:'Segoe UI',sans-serif}
.container{text-align:center;padding:20px}
h1{color:#ffeb3b;font-size:40px;text-shadow:0 0 20px #ffeb3b}
.msg{color:white;font-size:19px;max-width:340px;margin:25px auto;line-height:1.7}
.flower{font-size:120px;animation:grow 1.5s ease-out, float 2s infinite alternate;margin:20px 0}
@keyframes grow{0%{transform:scale(0)}100%{transform:scale(1)}}
@keyframes float{0%{transform:translateY(0)}100%{transform:translateY(-12px)}}
.btn{background:#ffeb3b;border:none;padding:16px 45px;border-radius:30px;font-weight:bold;font-size:20px;cursor:pointer;box-shadow:0 0 25px #ffeb3b;margin-top:20px}
.author{color:#666;font-size:11px;margin-top:25px;letter-spacing:2px}
#page1{background:#fff9c4;position:absolute;width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center}
#page1 h1{color:#5d4037;text-shadow:none}
#page2{background:#000;position:absolute;width:100%;height:100%;display:none;flex-direction:column;justify-content:center;align-items:center}
</style>
</head>
<body>

<div id="page1">
  <h1>Para Yuli 🌻</h1>
  <p style="color:#5d4037;margin:15px">Tengo un detalle para mi amor 💛</p>
  <div style="font-size:70px">💌</div>
  <button class="btn" onclick="openGift()">Toca aquí gordita ✨</button>
  <div class="author">— SHINODA87 —</div>
</div>

<div id="page2">
  <div class="container">
    <h1>Para Yuli 🌻</h1>
    <div class="flower">🌻</div>
    <div class="msg">
      Un pequeño detalle amarillo para mi amor porque hay personas que merecen un poquito de luz incluso un día cualquiera, te amo gordita. 💛
    </div>
    <div class="author">Hecho especialmente para Yuli — Shinoda87</div>
  </div>
</div>

<!-- ESTE ES EL QUE HACE SONAR FLORES AMARILLAS ORIGINAL -->
<iframe id="yt" width="0" height="0" style="display:none;" allow="autoplay; encrypted-media" src=""></iframe>

<script>
function openGift(){
  document.getElementById('page1').style.display='none';
  document.getElementById('page2').style.display='flex';
  // Canción original Flores Amarillas - Floricienta
  document.getElementById('yt').src="https://www.youtube.com/embed/c4r3mGs8a1w?autoplay=1&loop=1&playlist=c4r3mGs8a1w";
}
</script>

</body>
</html>
